[package]
name = "notability-converter"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 2

[dependencies]
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.35", features = ["rayon", "chrono_time"] }
walkdir = "2"

[workspace]
members = ["web"]
default-members = ["."]
resolver = "2"

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
